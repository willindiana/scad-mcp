name: Trusted release checks
# No pull_request trigger. Do NOT attach public repositories to LAN/self-hosted
# runners. Enable only after isolated ephemeral runner with no LAN routes,
# host sockets, secrets, private rules or persistent mounts is approved.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: public-release-isolated
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generic checks in isolated runner
        run: |
          set -eu
          # Runner supplies read-only trusted release-standard + pinned tools.
          test -x /opt/release-standard/release-check.sh
          GENERIC_ONLY=1 /opt/release-standard/release-check.sh "$PWD" 'uv run --locked pytest -q -m "not integration"'
