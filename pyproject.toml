[project]
name = "scad-mcp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
scad-mcp = "scad_mcp.server:main"

[tool.pytest.ini_options]
markers = ["integration: requires locally built OpenSCAD model image"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scad_mcp"]
